version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      backend:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      frontend:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
  - package-ecosystem: docker
    directories: ["/backend", "/frontend"]
    target-branch: develop
    schedule:
      interval: monthly
    commit-message:
      prefix: build
